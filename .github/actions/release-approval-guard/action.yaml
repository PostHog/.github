name: 'Release approval guard'
description: 'Fail a release when an approver of its environment authored or merged a PR in the push that triggered it'

inputs:
  environment:
    description: 'Name of the environment whose approval gates the release, e.g. "NPM Release"'
    required: true
  github-token:
    description: 'Token with `actions: read`, `contents: read` and `pull-requests: read` on the repository'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Check release approvers against the PRs in the push
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ENVIRONMENT: ${{ inputs.environment }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/guard.mjs"
