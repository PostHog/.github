name: 'Release approval guard'
description: 'Fail a release when an approver of its environment authored or committed to a PR in the release'

inputs:
  environment:
    description: 'Name of the environment whose approval gates the release, e.g. "NPM Release"'
    required: true
  changeset-dirs:
    description: 'Newline-separated directories, relative to the checkout, that hold the pending changeset .md files'
    required: false
    default: '.changeset'
  github-token:
    description: 'Token with `actions: read`, `contents: read` and `pull-requests: read` on the repository'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Check release approvers against release contributors
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ENVIRONMENT: ${{ inputs.environment }}
        CHANGESET_DIRS: ${{ inputs.changeset-dirs }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/guard.mjs"
