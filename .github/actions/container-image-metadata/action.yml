name: "container image metadata"
description: >-
  Tags, labels and OCI provenance annotations for a service container build --
  the deploy-pipeline contract consumed by Kargo. Wraps
  docker/metadata-action so every service stamps identical provenance: the
  standard org.opencontainers.image.* set plus commit author, committer,
  subject and committer timestamp, emitted as INDEX-LEVEL OCI annotations.
  Index-level matters: Kargo's freight discovery reads only OCI annotations
  (image config labels are invisible to it), and without a platform constraint
  it surfaces only the index level. Kargo warehouses additionally key their
  commit-order freight gate on org.opencontainers.image.revision, so the
  annotation set here is a contract -- do not rename keys without checking the
  warehouse criteria expressions and deploy_info consumers in the deployment repository.
  Run after actions/checkout (commit metadata falls back to git when the
  triggering event carries no head_commit). Feed all three outputs to
  docker/build-push-action: tags, labels, and annotations. Ordered release
  generation and publication require a `timeout` that supports --kill-after,
  as GNU coreutils and uutils coreutils on Ubuntu GitHub-hosted runners do.

inputs:
  images:
    required: true
    description: >-
      In the metadata phase, image repositories passed through unchanged to
      docker/metadata-action. In the publication phase, exactly one image
      repository (registry/name) is required, e.g.
      registry.example.com/my-service; missing,
      malformed, or multi-image values fail input validation.
  extra-tags:
    required: false
    description: >-
      Additional docker/metadata-action tag specs, one per line, APPENDED to
      the fixed contract tag (an immutable sha-<gitsha> tag — what Kargo
      image warehouses subscribe to). Deliberately additive rather than a
      replaceable tags input: a full-replace override would let a consumer
      silently drop the load-bearing sha- tag. No latest tag by default —
      re-pushing it fails on immutable ECR repos and nothing in the deploy
      pipeline reads it; consumers that want one pass
      "type=raw,value=latest,enable={{is_default_branch}}" here.
    default: ""
  generate-ordered-release-tag:
    required: false
    description: >-
      Compute the source-ordered release tag for an eligible default-branch
      build without adding it to the standard metadata tags. Generation is
      ignored when publish-ordered-release-tag is 'true'; the phases use
      separate action invocations. Generation runs only for push and manual
      dispatch events on the default branch. All other events and refs,
      including schedules, are excluded by an explicit step condition and
      produce no ordered-release annotation; failures within the allowed set
      remain fail-soft warnings. On a shallow checkout, the bounded
      --filter=tree:0 unshallow fetch registers origin as a promisor remote and
      marks the checkout as a partial clone. That mutation is ephemeral on
      GitHub-hosted runners but persists in self-hosted or reused checkouts.
    default: "false"
  publish-ordered-release-tag:
    required: false
    description: >-
      Run the bounded post-build publication and registry read-back phase.
      Invoke the action again after the required image build with this enabled;
      publication takes precedence when generation is also enabled because the
      phases use separate action invocations. Publication runs only for push
      and manual dispatch events on the default branch. All other events and
      refs, including schedules, are excluded by an explicit step condition
      and produce no ordered-release annotation; active publication retains
      its result annotations. The bounded operations of both invocations
      total at most 905 seconds; these are sums of the timed operations, not a
      limit on either phase, so set each job's timeout-minutes above them.
      Generation's bounded fetches total at most 440 seconds: 120 seconds for
      the treeless history fetch and 300 seconds for the full fetch that
      follows when it fails. Publication's bounded operations total at most
      465 seconds: two attempts of up to six 20-second read-backs and one
      35-second publication each, a 5-second pause between them, and 10
      seconds for the alert. Each history fetch, read-back and publication
      has a 10-second kill grace.
    default: "false"
  ordered-release-tag:
    required: false
    description: >-
      Source-ordered release tag returned by the pre-build invocation.
    default: ""
  ordered-release-digest:
    required: false
    description: >-
      Exact sha256 digest returned by the required image build. Index and
      single-manifest sources are both supported and retain this digest.
    default: ""
  alert-slack-bot-token:
    required: false
    description: >-
      Slack bot token for the publication phase. When the phase fails because
      the ordered alias is not confirmed, the action attempts one post to
      alert-slack-channel. Without a token the phase still fails, with no Slack
      message.
  alert-slack-channel:
    required: false
    description: >-
      Slack channel ID for the publication phase alert. The bot must be a
      member of the channel.
    default: "C0B11J29GP9"

outputs:
  tags:
    description: "Image tags, for docker/build-push-action `tags`."
    value: ${{ steps.meta.outputs.tags }}
  labels:
    description: "OCI labels, for docker/build-push-action `labels`."
    value: ${{ steps.meta.outputs.labels }}
  annotations:
    description: >-
      Index-level OCI annotations (provenance contract), for
      docker/build-push-action `annotations`.
    value: ${{ steps.meta.outputs.annotations }}
  commit-subject:
    description: >-
      First line of the commit message, hard-capped at 160 chars (also
      annotated on the image).
    value: ${{ steps.commit.outputs.subject }}
  commit-timestamp:
    description: "Committer timestamp, ISO 8601 UTC (also annotated on the image)."
    value: ${{ steps.commit.outputs.iso }}
  commit-author:
    description: "Commit author (GitHub login on push events, git author name otherwise; also annotated on the image)."
    value: ${{ steps.commit.outputs.author }}
  commit-committer:
    description: "Committer (GitHub login on push events, git committer name otherwise; also annotated on the image)."
    value: ${{ steps.commit.outputs.committer }}
  ordered-release-tag:
    description: >-
      Source-ordered release tag, or empty when generation is disabled or
      unavailable.
    value: ${{ steps.ordered-release.outputs.tag }}
  ordered-release-result:
    description: >-
      Post-build reconciliation result, or empty when the ordered publication
      phase did not run.
    value: ${{ steps.ordered-release-publication.outputs.result }}

runs:
  using: "composite"
  steps:
    # Commit metadata with fallbacks: push events carry head_commit (whose
    # author/committer usernames are GitHub logins, matching what
    # deploy_info historically records); other triggers fall back to git
    # name fields. The message can be multiline and annotations are one per
    # line, so only the subject line rides on the image — and the subject is
    # additionally HARD-CAPPED at 160 chars. Nothing bounds a single line
    # (PR titles alone reach 256 chars), and an unbounded value would flow
    # into every downstream consumer: the freight annotations, the
    # deployments-file deploy_info, promotion commit messages and
    # notifications. The legacy repository_dispatch path has already been
    # bitten by oversized commit messages (client_payload caps at 64KB);
    # this contract bounds the value at the source instead. The committer
    # timestamp is forced to UTC so consumers never parse mixed offsets.
    - name: Extract commit metadata
      id: commit
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        EVENT_AUTHOR: ${{ github.event.head_commit.author.username }}
        EVENT_COMMITTER: ${{ github.event.head_commit.committer.username }}
        # ${subject:0:157} and ${#subject} slice BYTES under a POSIX/C
        # locale, which can cut a multibyte character in half and stamp
        # invalid UTF-8 into the annotation. Pin the locale so slicing is
        # character-based regardless of the runner image's defaults.
        LC_ALL: C.UTF-8
      run: |
        # The three values below go to GITHUB_OUTPUT and into the
        # metadata-action annotations input, whose parser can take a
        # carriage return as a line break, opens a quoted field at a double
        # quote that directly follows a comma, and compiles each entry as a
        # Handlebars template. sanitize() keeps a value from starting
        # another output key or annotation by replacing every ASCII control
        # character (0x01-0x1F and DEL; an explicit range, because
        # [[:cntrl:]] under C.UTF-8 differs between platforms) with a space,
        # keeps it from being read as a template by breaking every "{{" into
        # "{ {", and keeps it from opening a quoted field by turning ',"'
        # into ', "'. It runs before the length cut, and a cut prefix plus
        # "..." cannot form a new "{{" or ',"'.
        sanitize() {
          local value="${1//[$'\001'-$'\037'$'\177']/ }"
          local open='{{' broken='{ {'
          local comma_quote=',"' spaced=', "'
          while [[ "${value}" == *"${open}"* ]]; do
            value="${value//"${open}"/"${broken}"}"
          done
          value="${value//"${comma_quote}"/"${spaced}"}"
          printf '%s' "${value}"
        }
        # No pipeline here: with printf | head, head exits after the first line
        # and printf, still writing a large remainder, fails with SIGPIPE.
        subject="${COMMIT_MESSAGE%%$'\n'*}"
        if [ -z "${subject}" ]; then
          subject="$(git log -1 --format=%s)"
        fi
        author="${EVENT_AUTHOR:-$(git log -1 --format=%an)}"
        committer="${EVENT_COMMITTER:-$(git log -1 --format=%cn)}"
        subject="$(sanitize "${subject}")"
        author="$(sanitize "${author}")"
        committer="$(sanitize "${committer}")"
        if [ "${#subject}" -gt 160 ]; then
          subject="${subject:0:157}..."
        fi
        {
          echo "subject=${subject}"
          echo "author=${author}"
          echo "committer=${committer}"
          echo "iso=$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd HEAD)"
        } >> "$GITHUB_OUTPUT"

    - name: Compute ordered release tag
      id: ordered-release
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.publish-ordered-release-tag != 'true' && inputs.generate-ordered-release-tag == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      continue-on-error: true
      shell: bash
      env:
        ORDERED_RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail

        skip_ordered_release_tag() {
          printf '::warning::Skipping ordered release tag because %s\n' "$1"
          printf 'tag=\n' >> "$GITHUB_OUTPUT"
          exit 0
        }

        # The step condition compares the ref ignoring letter case; Git refs do not.
        if [ -z "${ORDERED_RELEASE_DEFAULT_BRANCH:-}" ]; then
          skip_ordered_release_tag "the default branch is unknown"
        fi
        if [ "${GITHUB_REF:-}" != "refs/heads/${ORDERED_RELEASE_DEFAULT_BRANCH}" ]; then
          skip_ordered_release_tag "the ref is not exactly the default branch"
        fi

        # Test the behavior that the bounds need, not the version text.
        # Ubuntu 26.04 runners ship uutils coreutils, and GNU and uutils timeout behave the same here.
        timeout_is_usable() {
          local status=0
          command -v timeout >/dev/null 2>&1 || return 1
          timeout --kill-after=1s 0.1s sleep 5 || status=$?
          [ "$status" -eq 124 ] || return 1
          status=0
          # The subshell keeps the shell notice for the killed process out of the log.
          (timeout --kill-after=0.2s 0.1s bash -c 'trap "" TERM; while :; do :; done'; exit $?) 2>/dev/null || status=$?
          [ "$status" -eq 137 ]
        }

        if ! shallow="$(git rev-parse --is-shallow-repository 2>/dev/null)"; then
          skip_ordered_release_tag "repository history could not be inspected"
        fi

        fetch_history() {
          local bound="$1"
          shift
          timeout --kill-after=10s "$bound" git fetch \
            --no-tags \
            --prune \
            --no-recurse-submodules \
            --unshallow \
            "$@" \
            origin \
            "+${GITHUB_REF}:refs/remotes/origin/${GITHUB_REF_NAME}"
        }

        if [ "$shallow" = "true" ]; then
          if ! timeout_is_usable; then
            skip_ordered_release_tag "the timeout prerequisite is unavailable"
          fi
          fetch_status=0
          fetch_history 120s --filter=tree:0 || fetch_status=$?
          if [ "$fetch_status" -ne 0 ]; then
            printf '::warning::Treeless history fetch failed with status %s, retrying without --filter=tree:0\n' "$fetch_status"
            git config --unset remote.origin.promisor || true
            git config --unset remote.origin.partialclonefilter || true
            fetch_status=0
            fetch_history 300s || fetch_status=$?
            if [ "$fetch_status" -ne 0 ]; then
              skip_ordered_release_tag "complete source history could not be fetched (status $fetch_status)"
            fi
          fi
        fi

        if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != "false" ]; then
          skip_ordered_release_tag "complete source history is unavailable"
        fi

        if ! head_revision="$(git rev-parse HEAD 2>/dev/null)" || [ "$head_revision" != "$GITHUB_SHA" ]; then
          skip_ordered_release_tag "the checked-out revision does not match GITHUB_SHA"
        fi

        if ! position="$(git rev-list --first-parent --count "$GITHUB_SHA" 2>/dev/null)"; then
          skip_ordered_release_tag "the source position could not be computed"
        fi

        case "$position" in
          ""|0|0*|*[!0-9]*)
            skip_ordered_release_tag "the source position is outside the supported range"
            ;;
        esac

        if [ "${#position}" -gt 12 ] || ! [[ "$GITHUB_SHA" =~ ^[0-9a-f]{6,}$ ]]; then
          skip_ordered_release_tag "the source position is outside the supported range"
        fi

        if ! printf -v tag 'r%012d-%.6s' "$position" "$GITHUB_SHA" ||
          ! [[ "$tag" =~ ^r[0-9]{12}-[0-9a-f]{6}$ ]]; then
          skip_ordered_release_tag "the source position is outside the supported range"
        fi

        printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

    # DOCKER_METADATA_ANNOTATIONS_LEVELS=index is load-bearing, not a
    # preference: without it metadata-action emits labels only, which Kargo
    # cannot see; and index is the only level Kargo surfaces for a
    # multi-arch image without a platform constraint. Index-level
    # annotations also require the pushed artifact to be an OCI image index
    # -- multi-platform builds with buildkit's default provenance
    # attestations already produce one.
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: index
      with:
        images: ${{ inputs.images }}
        # Fixed contract tag first; extra-tags are appended, never replace
        # (metadata-action ignores blank lines when extra-tags is empty).
        # The sha- prefix is part of the contract: Kargo warehouses filter
        # on ^sha-, and a prefixed tag stays self-describing next to pr-*,
        # semver, and branch tags in the same repo.
        tags: |
          type=sha,prefix=sha-,format=long
          ${{ inputs.extra-tags }}
        annotations: |
          com.posthog.image.author=${{ steps.commit.outputs.author }}
          com.posthog.image.committer=${{ steps.commit.outputs.committer }}
          com.posthog.image.message=${{ steps.commit.outputs.subject }}
          com.posthog.image.commit-timestamp=${{ steps.commit.outputs.iso }}

    - name: Validate ordered release publication inputs
      id: ordered-release-validation
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.publish-ordered-release-tag == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      env:
        ORDERED_RELEASE_IMAGE: ${{ inputs.images }}
        ORDERED_RELEASE_TAG: ${{ inputs.ordered-release-tag }}
        ORDERED_RELEASE_DIGEST: ${{ inputs.ordered-release-digest }}
        ORDERED_RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail

        skip_publication() {
          printf '::warning::Skipping ordered image alias publication because %s\n' "$1"
          printf 'skip=true\nreason=%s\n' "${2:-$1}" >> "$GITHUB_OUTPUT"
          exit 0
        }

        # The step condition compares the ref ignoring letter case; Git refs do not.
        # skip=true keeps the publication step from running, and the check step fails with the reason.
        if [ -z "${ORDERED_RELEASE_DEFAULT_BRANCH:-}" ]; then
          skip_publication "the default branch is unknown"
        fi
        if [ "${GITHUB_REF:-}" != "refs/heads/${ORDERED_RELEASE_DEFAULT_BRANCH}" ]; then
          skip_publication "the ref is not exactly the default branch"
        fi

        repository="${ORDERED_RELEASE_IMAGE:-}"
        ordered_tag="${ORDERED_RELEASE_TAG:-}"
        expected_digest="${ORDERED_RELEASE_DIGEST:-}"
        source_revision="${GITHUB_SHA:-}"

        if [ -z "$ordered_tag" ]; then
          skip_publication "no ordered tag was generated" tag-unavailable
        fi

        while [[ "$repository" == [[:space:]]* ]]; do
          repository="${repository:1}"
        done
        while [[ "$repository" == *[[:space:]] ]]; do
          repository="${repository:0:${#repository}-1}"
        done

        case "$repository" in
          ""|-*|*[[:space:]@,]*)
            skip_publication "the publication phase requires exactly one image repository without whitespace, a digest, or a list separator"
            ;;
        esac

        registry="${repository%%/*}"
        repository_name="${repository#*/}"
        if [ "$registry" = "$repository" ]; then
          skip_publication "the publication phase requires an image repository in registry/name form"
        fi
        case "$registry" in
          ""|-*|*[[:space:]@,]*)
            skip_publication "the publication phase requires exactly one untagged image repository in registry/name form"
            ;;
        esac
        case "$repository_name" in
          ""|-*|*[[:space:]@,]*|*:*)
            skip_publication "the publication phase requires exactly one untagged image repository in registry/name form"
            ;;
        esac
        if ! [[ "$registry" =~ ^[a-zA-Z0-9]+([.-][a-zA-Z0-9]+)*(:[0-9]+)?$ ]] ||
          ! [[ "$repository_name" =~ ^[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$ ]]; then
          skip_publication "the publication phase image repository is malformed"
        fi

        if ! [[ "$ordered_tag" =~ ^r[0-9]{12}-[0-9a-f]{6}$ ]] ||
          ! [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
          ! [[ "$source_revision" =~ ^[0-9a-f]{6,}$ ]] ||
          [ "${ordered_tag##*-}" != "${source_revision:0:6}" ]; then
          skip_publication "the ordered tag, digest, and source revision must be present, valid, and revision-matched"
        fi

        printf 'image=%s\n' "$repository" >> "$GITHUB_OUTPUT"

    - name: Publish and reconcile ordered release tag
      id: ordered-release-publication
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.publish-ordered-release-tag == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.ordered-release-validation.outputs.skip != 'true'
      continue-on-error: true
      shell: bash
      env:
        ORDERED_RELEASE_IMAGE: ${{ steps.ordered-release-validation.outputs.image }}
        ORDERED_RELEASE_TAG: ${{ inputs.ordered-release-tag }}
        ORDERED_RELEASE_DIGEST: ${{ inputs.ordered-release-digest }}
      run: |
        set -euo pipefail

        # Test the behavior that the bounds need, not the version text.
        # Ubuntu 26.04 runners ship uutils coreutils, and GNU and uutils timeout behave the same here.
        timeout_is_usable() {
          local status=0
          command -v timeout >/dev/null 2>&1 || return 1
          timeout --kill-after=1s 0.1s sleep 5 || status=$?
          [ "$status" -eq 124 ] || return 1
          status=0
          # The subshell keeps the shell notice for the killed process out of the log.
          (timeout --kill-after=0.2s 0.1s bash -c 'trap "" TERM; while :; do :; done'; exit $?) 2>/dev/null || status=$?
          [ "$status" -eq 137 ]
        }

        if ! timeout_is_usable; then
          printf '%s\n' '::error title=Ordered image alias read-back unavailable::A timeout with --kill-after is required for bounded ordered image alias publication and read-back' >&2
          printf 'result=unknown\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        client_output="$(mktemp -d "$RUNNER_TEMP/ordered-image-alias.XXXXXX")"
        trap 'rm -rf "$client_output"' EXIT

        # Keep the 20s read-back and 35s publication bounds, the two attempts and the 5s pause in sync with the publish-ordered-release-tag latency budget above.
        inspect_digest() {
          local reference="$1"
          local output
          local status=0

          output="$(timeout --kill-after=10s 20s \
            docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' "$reference" 2>"$client_output/read")" || status=$?

          if [ "$status" -eq 0 ] && [[ "$output" =~ ^\"(sha256:[0-9a-f]{64})\"$ ]]; then
            printf '%s\n' "${BASH_REMATCH[1]}"
            return 0
          fi

          mv "$client_output/read" "$client_output/failed-read"
          if [ -n "$output" ]; then
            printf 'Client output:\n%s\n' "$output" >> "$client_output/failed-read"
          fi
          if [ "$status" -eq 0 ]; then
            printf 'output format failure, client exit status 0' > "$client_output/failed-read-status"
            return 65
          fi
          printf 'exit status %s' "$status" > "$client_output/failed-read-status"
          return "$status"
        }

        classify_alias() {
          local target="$1"
          local source="$2"
          local expected="$3"
          local observed

          if observed="$(inspect_digest "$target")" || observed="$(inspect_digest "$target")"; then
            if [ "$observed" = "$expected" ]; then
              printf '%s\n' present-at-expected-digest
            else
              printf '%s\n' integrity-mismatch
            fi
          elif inspect_digest "$source" >/dev/null; then
            printf '%s\n' absent
          else
            printf '%s\n' unknown
          fi
        }

        repository="$ORDERED_RELEASE_IMAGE"
        ordered_tag="$ORDERED_RELEASE_TAG"
        expected_digest="$ORDERED_RELEASE_DIGEST"
        target_image="${repository}:${ordered_tag}"
        source_image="${repository}@${expected_digest}"
        write_status=""

        # An attempt writes the alias only when its probe finds it absent, then reads it back.
        for attempt in 1 2; do
          if [ "$attempt" -gt 1 ]; then
            sleep 5
          fi
          result="$(classify_alias "$target_image" "$source_image" "$expected_digest")" || result=unknown
          if [ "$result" = absent ]; then
            write_status=0
            timeout --kill-after=10s 35s \
              docker buildx imagetools create --prefer-index=false --tag "$target_image" "$source_image" >"$client_output/write" 2>&1 || write_status=$?
            result="$(classify_alias "$target_image" "$source_image" "$expected_digest")" || result=unknown
          fi
          printf 'Attempt %s ended %s\n' "$attempt" "$result"
          case "$result" in
            absent|unknown) ;;
            *) break ;;
          esac
        done
        printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
        printf 'Ordered image alias result %s from attempt %s\n' "$result" "$attempt"

        # Registry client output is untrusted: stop-commands with a random marker keeps it from issuing workflow commands.
        if [ "$result" != present-at-expected-digest ]; then
          marker="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            printf '::stop-commands::%s\n' "$marker"
            printf 'Last failed registry read, %s:\n' "$(cat "$client_output/failed-read-status" 2>/dev/null || printf 'none')"
            cat "$client_output/failed-read" 2>/dev/null || true
            printf '\nLast alias write, exit status %s:\n' "${write_status:-none}"
            cat "$client_output/write" 2>/dev/null || true
            printf '\n::%s::\n' "$marker"
          } >&2
        fi

    # The last step of the publish phase and the only one that fails it. It
    # runs when validation ran and set image (valid inputs) or reason
    # (publication skipped), so validation's condition is the publish gate.
    # Its condition has no status function, so it does not run after an
    # earlier step of this invocation failed or the job was cancelled.
    - name: Check ordered release alias
      id: ordered-release-check
      if: steps.ordered-release-validation.outputs.image != '' || steps.ordered-release-validation.outputs.reason != ''
      shell: bash
      env:
        ORDERED_RELEASE_RESULT: ${{ steps.ordered-release-publication.outputs.result }}
        ORDERED_RELEASE_SKIP_REASON: ${{ steps.ordered-release-validation.outputs.reason }}
        ORDERED_RELEASE_IMAGE: ${{ inputs.images }}
        ORDERED_RELEASE_TAG: ${{ inputs.ordered-release-tag }}
        ALERT_SLACK_BOT_TOKEN: ${{ inputs.alert-slack-bot-token }}
        ALERT_SLACK_CHANNEL: ${{ inputs.alert-slack-channel }}
      run: |
        set -euo pipefail

        # set +a and declare +x keep the copy unexported even when the job environment turns on allexport or exports this name.
        set +a
        declare +x alert_token="${ALERT_SLACK_BOT_TOKEN:-}"
        unset ALERT_SLACK_BOT_TOKEN
        if [ -n "$alert_token" ]; then
          printf '%s\n' 'An alert token was supplied'
        else
          printf '%s\n' 'No alert token was supplied'
        fi

        no_freight="Kargo creates no Freight for this build, so deploys stay on the previous build"
        uncertain="The alias could not be verified at the expected digest, so whether Kargo creates Freight for this build is uncertain"
        rerun_job="Re-running the failed job retries"

        if [ -n "${ORDERED_RELEASE_SKIP_REASON:-}" ]; then
          status="$ORDERED_RELEASE_SKIP_REASON"
          consequence="$no_freight"
          retry="Re-run all jobs: the failed job alone reuses the build's empty value"
        else
          status="${ORDERED_RELEASE_RESULT:-unknown}"
          case "$status" in
            present-at-expected-digest)
              printf '%s\n' '::notice title=Ordered image alias present::Registry read-back confirmed the expected build digest'
              exit 0
              ;;
            absent)
              consequence="$no_freight"
              retry="$rerun_job"
              ;;
            integrity-mismatch)
              consequence="$uncertain"
              retry="A re-run cannot clear it"
              ;;
            *)
              consequence="$uncertain"
              retry="$rerun_job"
              ;;
          esac
        fi

        printf '::error title=Ordered image alias not confirmed::%s. %s. %s.\n' "$status" "$consequence" "$retry"

        if [ -z "$alert_token" ]; then
          exit 1
        fi

        alert_not_sent() {
          printf '::warning title=Ordered image alias alert not sent::%s\n' "$1"
          exit 1
        }

        body_status=0
        body="$(ALERT_STATUS="$status" ALERT_CONSEQUENCE="$consequence" ALERT_RETRY="$retry" jq -n '
          def none_if_empty: if . == "" then "none" else . end;
          def slack_escape: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
          {
            channel: env.ALERT_SLACK_CHANNEL,
            unfurl_links: false,
            unfurl_media: false,
            text: ([
              "Ordered image alias not confirmed in \(env.GITHUB_REPOSITORY)",
              "Image repository: \(env.ORDERED_RELEASE_IMAGE | none_if_empty | slack_escape)",
              "Ordered tag: \(env.ORDERED_RELEASE_TAG | none_if_empty | slack_escape)",
              "Result: \(env.ALERT_STATUS)",
              "Commit: \(env.GITHUB_SHA[0:7])",
              "Run: \(env.GITHUB_SERVER_URL)/\(env.GITHUB_REPOSITORY)/actions/runs/\(env.GITHUB_RUN_ID)",
              "\(env.ALERT_CONSEQUENCE). \(env.ALERT_RETRY)."
            ] | join("\n"))
          }')" || body_status=$?
        if [ "$body_status" -ne 0 ]; then
          alert_not_sent "The alert body could not be built, jq exit status $body_status"
        fi

        # The token reaches curl as a header file on a pipe, never as an argument or an environment variable.
        # -q, which curl honours only as the first argument, keeps a .curlrc from changing the request.
        post_status=0
        reply="$(printf '%s' "$body" | curl -q --silent --show-error --max-time 10 \
          --header 'Content-Type: application/json; charset=utf-8' \
          --header @<(printf 'Authorization: Bearer %s\n' "$alert_token") \
          --data-binary @- \
          https://slack.com/api/chat.postMessage)" || post_status=$?

        if [ "$post_status" -ne 0 ]; then
          alert_not_sent "The Slack request failed with curl exit status $post_status"
        fi
        # Sent only when the reply is exactly one JSON object whose ok is the boolean true.
        if jq -n -e '[inputs] | length == 1 and (.[0] | type == "object" and .ok == true)' <<<"$reply" >/dev/null 2>&1; then
          printf '%s\n' 'Alert sent to Slack'
          exit 1
        fi
        slack_error="$(jq -r '.error // empty' <<<"$reply" 2>/dev/null)" || slack_error=""
        if ! [[ "$slack_error" =~ ^[a-z0-9_]+$ ]]; then
          slack_error="no recognizable error code"
        fi
        alert_not_sent "Slack did not accept the alert: $slack_error"
