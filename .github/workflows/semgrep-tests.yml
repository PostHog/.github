on:
    pull_request:
    merge_group:

name: Semgrep Tests

permissions:
    contents: read

env:
    SEMGREP_ENABLE_VERSION_CHECK: 'false'

jobs:
    semgrep-test-rules:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        container:
            image: semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Test custom Semgrep rules
              run: |
                  semgrep --test .semgrep/

            - name: Test Semgrep result reporting
              run: |
                  python3 -m unittest discover .github/scripts -p 'test_*.py'
