on:
    pull_request:
    merge_group:

name: Semgrep Tests

permissions:
    contents: read

env:
    SEMGREP_ENABLE_VERSION_CHECK: 'false'

jobs:
    semgrep-test-rules:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        container:
            image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Test custom Semgrep rules
              run: |
                  semgrep --test .semgrep/

            - name: Test Semgrep result reporting
              run: |
                  python3 -m unittest discover .github/scripts -p 'test_*.py'
