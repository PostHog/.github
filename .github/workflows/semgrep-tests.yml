on:
    pull_request:
    merge_group:

name: Semgrep Tests

permissions:
    contents: read

env:
    SEMGREP_ENABLE_VERSION_CHECK: 'false'

jobs:
    semgrep-test-rules:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        container:
            image: semgrep/semgrep:1.167.0@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Test custom Semgrep rules
              run: |
                  semgrep --test .semgrep/

            - name: Test Semgrep result reporting
              run: |
                  python3 -m unittest discover .github/scripts -p 'test_*.py'
