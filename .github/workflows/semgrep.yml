on:
    pull_request:
    merge_group:

name: Semgrep

permissions:
    contents: read

env:
    SEMGREP_ENABLE_VERSION_CHECK: 'false'

jobs:
    # scans GitHub Actions and other repo-wide config
    semgrep:
        # This workflow runs org-wide as a required workflow. Private/internal repos
        # get the faster Depot runner; public repos stay on GitHub-hosted ubuntu-latest
        # (free minutes, and not every public repo has Depot enabled). The repository
        # context reflects the target repo, so this resolves per-repo automatically.
        runs-on: ${{ github.event.repository.private && 'depot-ubuntu-latest' || 'ubuntu-latest' }}
        timeout-minutes: 15
        container:
            image: semgrep/semgrep:1.167.0@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Checkout .github repo (for custom semgrep rules)
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: PostHog/.github
                  path: dotgithub-repo
                  sparse-checkout: |
                      .semgrep
                      .github/scripts

            - name: Check for .github directory
              id: check
              run: |
                  if [ -d ".github/" ]; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Run Semgrep
              id: semgrep
              if: steps.check.outputs.exists == 'true'
              # continue-on-error keeps the reporting step below in charge of the job's outcome, at the cost
              # of this step reporting green in the UI and the API even when Semgrep failed. When debugging a
              # failed scan, read the check run's annotations rather than the step conclusions.
              continue-on-error: true
              run: |
                  # --strict fails the scan on any analysis error, including a rule that exceeds Semgrep's
                  # per-rule-per-file time budget. That budget defaults to 5s, which is close enough to what
                  # the slowest rules need on a large workflow file that a busy runner decides the outcome,
                  # so pass a generous --timeout and let the job timeout catch a genuinely stuck rule.
                  #
                  # The first three github-actions exclusions are upstream rules that reparse every run block
                  # as Bash and reject valid GitHub expressions. Local generic-parser replacements preserve
                  # their coverage. Remove both exclusions and the replacements after
                  # https://github.com/semgrep/semgrep-rules/issues/3688 is fixed and the compatibility
                  # fixture passes with p/github-actions under --strict.
                  #
                  # The trailofbits Ansible rules only match Ansible playbooks, so they cannot produce a true
                  # positive on the GitHub Actions workflows and config that make up .github/ — but they are
                  # by far the most expensive rules here (~85% of this scan's wall clock on a large .github/
                  # directory) and were the ones timing out. Drop them if a repo ever keeps playbooks here.
                  semgrep \
                    --config "dotgithub-repo/.semgrep/rules/" \
                    --config "p/owasp-top-ten" \
                    --config "p/security-audit" \
                    --config "p/trailofbits" \
                    --config "p/github-actions" \
                    --exclude-rule trailofbits.generic.curl-unencrypted-url.curl-unencrypted-url \
                    --exclude-rule dockerfile.security.no-sudo-in-dockerfile.no-sudo-in-dockerfile \
                    --exclude-rule trailofbits.generic.redis-unencrypted-transport.redis-unencrypted-transport \
                    --exclude-rule trailofbits.yaml.docker-compose.port-all-interfaces.port-all-interfaces \
                    --exclude-rule yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command \
                    --exclude-rule yaml.github-actions.security.curl-eval.curl-eval \
                    --exclude-rule yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell \
                    --exclude-rule trailofbits.yaml.ansible.apt-key-unencrypted-url.apt-key-unencrypted-url \
                    --exclude-rule trailofbits.yaml.ansible.apt-key-validate-certs-disabled.apt-key-validate-certs-disabled \
                    --exclude-rule trailofbits.yaml.ansible.apt-unencrypted-url.apt-unencrypted-url \
                    --exclude-rule trailofbits.yaml.ansible.dnf-unencrypted-url.dnf-unencrypted-url \
                    --exclude-rule trailofbits.yaml.ansible.dnf-validate-certs-disabled.dnf-validate-certs-disabled \
                    --exclude-rule trailofbits.yaml.ansible.get-url-unencrypted-url.get-url-unencrypted-url \
                    --exclude-rule trailofbits.yaml.ansible.get-url-validate-certs-disabled.get-url-validate-certs-disabled \
                    --exclude-rule trailofbits.yaml.ansible.rpm-key-unencrypted-url.rpm-key-unencrypted-url \
                    --exclude-rule trailofbits.yaml.ansible.rpm-key-validate-certs-disabled.rpm-key-validate-certs-disabled \
                    --exclude-rule trailofbits.yaml.ansible.unarchive-unencrypted-url.unarchive-unencrypted-url \
                    --exclude-rule trailofbits.yaml.ansible.unarchive-validate-certs-disabled.unarchive-validate-certs-disabled \
                    --exclude-rule trailofbits.yaml.ansible.wrm-cert-validation-ignore.wrm-cert-validation-ignore \
                    --exclude-rule trailofbits.yaml.ansible.yum-unencrypted-url.yum-unencrypted-url \
                    --exclude-rule trailofbits.yaml.ansible.yum-validate-certs-disabled.yum-validate-certs-disabled \
                    --exclude-rule trailofbits.yaml.ansible.zypper-repository-unencrypted-url.zypper-repository-unencrypted-url \
                    --exclude-rule trailofbits.yaml.ansible.zypper-unencrypted-url.zypper-unencrypted-url \
                    --timeout 300 \
                    --error \
                    --strict \
                    --json-output "$RUNNER_TEMP/semgrep.json" \
                    --metrics=off \
                    --verbose \
                    .github/

            - name: Report Semgrep results
              if: always() && steps.semgrep.outcome != 'skipped'
              env:
                  SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
              run: |
                  python3 dotgithub-repo/.github/scripts/report-semgrep-results.py "$RUNNER_TEMP/semgrep.json"
                  if [ "$SEMGREP_OUTCOME" != "success" ]; then
                    exit 1
                  fi
