on:
    push:
        branches:
            - main
    pull_request:
    merge_group:

name: Security

permissions:
    contents: read

env:
    SEMGREP_ENABLE_VERSION_CHECK: 'false'

jobs:
    # scans GitHub Actions and other repo-wide config
    semgrep-local:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        container:
            image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # Registry packs are pinned as snapshots in .semgrep/registry/
            # (refreshed by the semgrep-registry-update workflow), which is
            # also excluded from the scan target — vendored upstream rule
            # files aren't ours to lint.
            # exclude all directories already scanned by other jobs
            - name: Run Semgrep
              run: |
                  semgrep \
                    --config ".semgrep/registry/owasp-top-ten.yaml" \
                    --config ".semgrep/registry/security-audit.yaml" \
                    --config ".semgrep/registry/trailofbits.yaml" \
                    --config ".semgrep/registry/github-actions.yaml" \
                    --exclude ".semgrep/rules/*.test.yaml" \
                    --exclude ".semgrep/registry" \
                    --error \
                    --metrics=off \
                    --verbose \
                    .
