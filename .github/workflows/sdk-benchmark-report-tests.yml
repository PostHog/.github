name: SDK benchmark workflow tests

on:
    pull_request:
        paths:
            - '.github/workflows/sdk-benchmark-report*.yml'
            - '.github/scripts/sdk-benchmark-workflow.test.mjs'
    push:
        branches: [main]
        paths:
            - '.github/workflows/sdk-benchmark-report*.yml'
            - '.github/scripts/sdk-benchmark-workflow.test.mjs'

permissions: {}

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        # Exercise the same concurrency syntax on a read-only job before publisher rollout.
        concurrency:
            group: sdk-benchmark-workflow-test-${{ github.run_id }}
            cancel-in-progress: false
            queue: max
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24.13.0'
                  package-manager-cache: false
            - run: node --test .github/scripts/sdk-benchmark-workflow.test.mjs
