    - pattern-either:
      - pattern-inside: "import $S from \"dompurify\"\n...\n"
      - pattern-inside: "import { ..., $S,... } from \"dompurify\"\n...\n"
      - pattern-inside: "import * as $S from \"dompurify\"\n...\n"
      - pattern-inside: "$S = require(\"dompurify\")\n...\n"
