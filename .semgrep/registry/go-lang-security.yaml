  languages:
  - go
  severity: WARNING
  patterns:
  - pattern-inside: 'import "net/http/httputil"

      ...

      '
  - pattern-either:
    - pattern: $PROXY.Director = $FUNC
    - patterns:
      - pattern-inside: "httputil.ReverseProxy{\n    ...\n}\n"
      - pattern: 'Director: $FUNC

          '
  metadata:
    cwe:
    - 'CWE-115: Misinterpretation of Input'
    category: security
    subcategory:
    - audit
    technology:
    - go
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    references:
    - https://github.com/golang/go/issues/50580
    license: Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license
    vulnerability_class:
    - Other
    source: https://semgrep.dev/r/go.lang.security.reverseproxy-director.reverseproxy-director
    shortlink: https://sg.run/9AYYR
    semgrep.dev:
      rule:
        r_id: 146567
        rv_id: 945612
        rule_id: zdUKzzA
        version_id: DkTNpvx
        url: https://semgrep.dev/playground/r/DkTNpvx/go.lang.security.reverseproxy-director.reverseproxy-director
        origin: community
- id: go.lang.security.shared-url-struct-mutation.shared-url-struct-mutation
  message: Shared URL struct may have been accidentally mutated. Ensure that this behavior is intended.
  languages:
  - go
  severity: WARNING
  patterns:
  - pattern-inside: 'import "net/url"

      ...

      '
  - pattern-not-inside: '... = url.Parse(...)

      ...

      '
  - pattern-not-inside: '... = url.ParseRequestURI(...)

      ...

      '
  - pattern-not-inside: '... = url.URL{...}

      ...

      '
  - pattern-not-inside: 'var $URL *$X.URL

      ...

      '
  - pattern-either:
    - pattern: $URL.RawQuery = ...
    - pattern: $URL.Path = ...
    - pattern: $URL.RawPath = ...
    - pattern: $URL.Fragment = ...
    - pattern: $URL.RawFragment = ...
    - pattern: $URL.Scheme = ...
    - pattern: $URL.Opaque = ...
    - pattern: $URL.Host = ...
    - pattern: $URL.User = ...
  - metavariable-pattern:
      metavariable: $URL
      patterns:
      - pattern-not: $X.$Y
      - pattern-not: $X[...]
  metadata:
    cwe:
    - 'CWE-436: Interpretation Conflict'
    category: security
    subcategory:
    - audit
    technology:
    - go
    confidence: LOW
    likelihood: LOW
    impact: LOW
    references:
    - https://github.com/golang/go/issues/63777
    license: Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license
    vulnerability_class:
    - Other
    source: https://semgrep.dev/r/go.lang.security.shared-url-struct-mutation.shared-url-struct-mutation
    shortlink: https://sg.run/yyEEd
    semgrep.dev:
      rule:
        r_id: 146568
        rv_id: 945613
        rule_id: pKU1EEO
        version_id: WrTEojd
        url: https://semgrep.dev/playground/r/WrTEojd/go.lang.security.shared-url-struct-mutation.shared-url-struct-mutation
        origin: community
- id: go.lang.security.zip.path-traversal-inside-zip-extraction
  message: File traversal when extracting zip archive
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path Traversal'')'
    source_rule_url: https://github.com/securego/gosec/issues/205
    category: security
    technology:
    - go
    confidence: LOW
    owasp:
    - A05:2017 - Broken Access Control
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    license: Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license
    vulnerability_class:
    - Path Traversal
    source: https://semgrep.dev/r/go.lang.security.zip.path-traversal-inside-zip-extraction
    shortlink: https://sg.run/Av64
    semgrep.dev:
      rule:
        r_id: 9106
        rv_id: 1262971
        rule_id: zdUkoR
        version_id: rxTAK1Z
        url: https://semgrep.dev/playground/r/rxTAK1Z/go.lang.security.zip.path-traversal-inside-zip-extraction
        origin: community
  languages:
  - go
  severity: WARNING
  pattern: "reader, $ERR := zip.OpenReader($ARCHIVE)\n...\nfor _, $FILE := range reader.File {\n  ...\n  path := filepath.Join($TARGET,\
    \ $FILE.Name)\n  ...\n}\n"
