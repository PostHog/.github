        - pattern: "$OPTS = {url: \"$URL\"}\n...\n$AXIOS($OPTS, ...)\n"
    - pattern: fetch("$URL", ...)
  - metavariable-regex:
      metavariable: $URL
      regex: ^([Hh][Tt][Tt][Pp]:\/\/(?!localhost).*)
  severity: ERROR
