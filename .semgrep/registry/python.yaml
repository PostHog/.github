- fix-regex:
    count: 1
    regex: unsafe_load
    replacement: safe_load
  id: python.lang.security.deserialization.avoid-pyyaml-load.avoid-pyyaml-load
  languages:
  - python
  message: Detected a possible YAML deserialization vulnerability. `yaml.unsafe_load`, `yaml.Loader`, `yaml.CLoader`, 
    and `yaml.UnsafeLoader` are all known to be unsafe methods of deserializing YAML. An attacker with control over the 
    YAML input could create special YAML input that allows the attacker to run arbitrary Python code. This would allow 
    the attacker to steal files, download and install malware, or otherwise take over the machine. Use `yaml.safe_load` 
    or `yaml.SafeLoader` instead.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-502: Deserialization of Untrusted Data'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    license: Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license
    likelihood: LOW
    owasp:
    - A08:2017 - Insecure Deserialization
    - A08:2021 - Software and Data Integrity Failures
    - A08:2025 - Software or Data Integrity Failures
    references:
    - https://github.com/yaml/pyyaml/wiki/PyYAML-yaml.load(input)-Deprecation
    - https://nvd.nist.gov/vuln/detail/CVE-2017-18342
    semgrep.dev:
      rule:
        origin: community
        r_id: 9673
        rule_id: ZqU5jZ
        rv_id: 1263530
        url: 
          https://semgrep.dev/playground/r/1QTyprw/python.lang.security.deserialization.avoid-pyyaml-load.avoid-pyyaml-load
        version_id: 1QTyprw
    shortlink: https://sg.run/we9Y
    source: https://semgrep.dev/r/python.lang.security.deserialization.avoid-pyyaml-load.avoid-pyyaml-load
    subcategory:
    - audit
    technology:
    - pyyaml
    vulnerability_class:
    - 'Insecure Deserialization '
  patterns:
  - pattern-inside: "import yaml\n...\n"
  - pattern-not-inside: "$YAML = ruamel.yaml.YAML(...)\n...\n"
  - pattern-either:
    - pattern: yaml.unsafe_load(...)
    - pattern: yaml.load(..., Loader=yaml.Loader, ...)
    - pattern: yaml.load(..., Loader=yaml.UnsafeLoader, ...)
    - pattern: yaml.load(..., Loader=yaml.CLoader, ...)
    - pattern: yaml.load_all(..., Loader=yaml.Loader, ...)
    - pattern: yaml.load_all(..., Loader=yaml.UnsafeLoader, ...)
    - pattern: yaml.load_all(..., Loader=yaml.CLoader, ...)
  severity: ERROR
